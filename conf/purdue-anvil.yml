# Site catalog file to be used when running on
# Purdue Anvil Cluster and submitting from the Anvil Cloud
# This is for direct submissions to the SLURM cluster.
x-pegasus:
  apiLang: python
  createdBy: vahi@isi.edu
  createdOn: 09-25-26T00:00:00Z
pegasus: 5.0.4
sites:
- name: compute
  directories:
  - type: sharedScratch
    path: /anvil/scratch/${RESOURCE_USERNAME}/scratch
    sharedFileSystem: false
    fileServers:
    - url: file:///anvil/scratch/${RESOURCE_USERNAME}/scratch
      operation: all
  - type: localStorage
    path: ${HOME}/SLURM/storage
    sharedFileSystem: false
    fileServers:
    - url: file://${HOME}/wf-outputs
      operation: all
  profiles:
    condor:
      grid_resource: batch slurm
    pegasus:
      style: glite
      queue: compute
      project: ${RESOURCE_PROJECT}
      data.configuration: nonsharedfs
      auxillary.local: 'true'
      nodes: 1
      ppn: 1
      runtime: 1800
      clusters.num: 2
  x-tags:
    - name: gpu
      profiles:
        pegasus:
          gpus: 1
          queue: gpu
    - name: cpu
      profiles:
        pegasus:
          cores: 1
          queue: shared
